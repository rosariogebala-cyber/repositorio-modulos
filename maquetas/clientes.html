<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clientes · Lanzate</title>
  <link rel="icon" href="../assets/favicon-lanzate.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
  <link href="css/lanzate.css?v=pedir-clave-2" rel="stylesheet">
</head>
<body class="lib-page pf-page" data-page="clientes">
  <a class="lib-skip-link" href="#contenido-principal">Saltar al contenido</a>
  <header class="lib-header">
    <a class="lib-brand" href="../index.html"><span class="lib-brand-mark" aria-hidden="true"><i class="bi bi-rocket-takeoff-fill"></i></span>Lanzate</a>
    <nav aria-label="Navegación principal">
      <a href="../index.html">Biblioteca<span class="lib-nav-long"> de módulos</span></a>
      <a href="index.html">Maquetas</a>
      <a href="constructor.html">Crear landing</a>
      <a href="landings.html">Landings</a>
      <a class="is-current" href="clientes.html">Clientes</a>
      <a href="reglas.html">Reglas</a>
    </nav>
  </header>

  <main class="pf-main" id="contenido-principal" tabindex="-1">
    <div class="pf-head">
      <div>
        <p class="lb-kicker">Plataforma · <span data-pf-count>0 clientes</span></p>
        <h1 class="pf-title">Clientes</h1>
        <p class="pf-sub">Dá de alta a cada cliente y después creale sus landings.</p>
      </div>
      <button class="btn-nx" type="button" data-pf-new-client><i class="bi bi-plus-lg"></i> Nuevo cliente</button>
    </div>

    <div class="pf-filters">
      <div class="lb-search">
        <i class="bi bi-search" aria-hidden="true"></i>
        <input type="search" placeholder="Buscar por nombre, rubro, contacto o email" aria-label="Buscar cliente" data-pf-search>
      </div>
      <select class="lb-input pf-select" aria-label="Filtrar por tipo de cliente" data-pf-type>
        <option value="">Todos los tipos</option>
        <option value="real">Reales</option>
        <option value="demo">Demo</option>
      </select>
      <div class="lb-seg" role="group" aria-label="Filtrar por estado" data-pf-filter>
        <button type="button" data-value="" aria-pressed="true">Todos</button>
        <button type="button" data-value="activo" aria-pressed="false">Activos</button>
        <button type="button" data-value="pausado" aria-pressed="false">Pausados</button>
      </div>
    </div>

    <p class="lb-msg" data-pf-msg role="status" aria-live="polite"></p>
    <div class="pf-grid" data-pf-clients></div>
    <p class="pf-empty" data-pf-empty hidden></p>
  </main>

  <script src="js/plataforma.js?v=pedir-clave-2"></script>
</body>
</html>
