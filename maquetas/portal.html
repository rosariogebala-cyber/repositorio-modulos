<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal del cliente · Lanzate</title>
  <link rel="icon" href="/assets/favicon-lanzate.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/maquetas/css/fonts.css" rel="stylesheet">
  <link href="/maquetas/css/lanzate.css" rel="stylesheet">
</head>
<body class="lib-page pf-page pt-portal">
  <header class="lib-header">
    <a class="lib-brand" href="" data-brand><span class="lib-brand-mark" aria-hidden="true">L</span><span data-brand-name>Sitio</span></a>
    <a class="pt-wa" data-wa href="https://wa.me/5491166035111" target="_blank" rel="noopener"><i class="bi bi-whatsapp" aria-hidden="true"></i> WhatsApp</a>
  </header>
  <main class="pf-main" data-portal>
    <p class="pf-empty">Cargando…</p>
  </main>
  <script>
    (function () {
      var root = document.querySelector("[data-portal]");
      var brand = document.querySelector("[data-brand]");
      var brandName = document.querySelector("[data-brand-name]");
      var sitio = (location.pathname.match(/^\/sitio\/([a-z0-9-]+)\/?$/) || [])[1] || "";
      function setBrand(nombre) {
        brandName.textContent = nombre || "Sitio";
        brand.href = sitio ? "/sitio/" + sitio + "/" : "/maquetas/portal.html";
        if (nombre) document.title = nombre;
      }
      function esc(s) {
        return String(s || "").replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
      function api(method, path, body) {
        return fetch(path, {
          method: method,
          credentials: "same-origin",
          headers: body ? { "Content-Type": "application/json" } : {},
          body: body ? JSON.stringify(body) : undefined
        }).then(function (r) {
          return r.json().then(function (data) {
            if (!r.ok) throw new Error(data.error || "No se pudo completar la acción.");
            return data;
          });
        });
      }
      function loginForm(note) {
        root.classList.add("pt-signed-out");
        root.innerHTML =
          '<h1 class="pf-title">' + esc(brandName.textContent) + "</h1>" +
          '<p class="pt-plan">Entrá a tu sitio.</p>' +
          (note ? '<p class="lb-msg ok">' + esc(note) + "</p>" : "") +
          '<form class="pt-login" data-login><label>Usuario <input name="usuario" required autocomplete="username"></label>' +
          '<label>Contraseña <input name="clave" type="password" required autocomplete="current-password"></label>' +
          '<label><input name="recordar" type="checkbox"> Recordar en este equipo</label>' +
          '<button class="btn-nx" type="submit">Entrar</button></form>' +
          '<form data-olvide hidden><label>Usuario <input name="usuario" required autocomplete="username"></label>' +
          '<button class="btn-nx" type="submit">Enviar enlace de recuperación</button></form>' +
          '<p><button type="button" data-show-olvide>Olvidé mi contraseña</button></p>' +
          '<p data-msg role="status"></p>';
        root.querySelector("[data-login]").addEventListener("submit", function (e) {
          e.preventDefault();
          api("POST", "/api/portal/login", {
            usuario: e.target.usuario.value,
            clave: e.target.clave.value,
            recordar: e.target.recordar.checked,
            sitio: sitio
          }).then(function () {
            if (!sitio) return api("GET", "/api/portal/sesion").then(function (s) { if (s.sitio) location.href = s.sitio; else home(); });
            home();
          }).catch(function (err) { root.querySelector("[data-msg]").textContent = err.message; });
        });
        root.querySelector("[data-show-olvide]").addEventListener("click", function () {
          root.querySelector("[data-olvide]").hidden = false;
        });
        root.querySelector("[data-olvide]").addEventListener("submit", function (e) {
          e.preventDefault();
          api("POST", "/api/portal/olvide", { usuario: e.target.usuario.value, sitio: sitio }).then(function () {
            root.querySelector("[data-msg]").textContent = "Si la cuenta tiene un correo habilitado, te enviamos un enlace. Si necesitás ayuda, contactá a Lanzate.";
          }).catch(function (err) { root.querySelector("[data-msg]").textContent = err.message; });
        });
      }
      var WA = "https://wa.me/5491166035111?text=";
      function wa(text) { return WA + encodeURIComponent(text); }
      var leadStates = { nueva: "Nueva", respondida: "Respondida", cerrada: "Cerrada" };
      function activityEntries(items, empty) {
        if (!items.length) return "<p>" + empty + "</p>";
        return '<ul class="pt-inbox">' + items.map(function (item) {
          var fields = Object.entries(item.datos || {});
          var email = fields.map(function (entry) { return String(entry[1]).trim(); }).find(function (value) {
            return /^[a-z0-9._+%-]+@[a-z0-9.-]+\.[a-z]{2,}$/i.test(value);
          });
          var state = item.estado_atencion;
          var controls = item.tipo === "turno" ? "" :
            '<form class="pt-lead-actions" data-lead="' + Number(item.id) + '"><label>Estado <select class="lb-input" name="estado">' +
            Object.keys(leadStates).map(function (key) {
              return '<option value="' + key + '"' + (state === key ? " selected" : "") + '>' + leadStates[key] + '</option>';
            }).join("") + '</select></label><button class="btn-nx btn-sm" type="submit">Guardar estado</button>' +
            (email ? '<a class="btn-nx-outline btn-sm" href="mailto:' + esc(email) + '">Responder por email</a>' : "") + "</form>";
          return '<li><details><summary><strong>' + (item.tipo === "turno" ? "Solicitud de turno" : "Consulta · " + esc(leadStates[state])) +
            "</strong><span>" + esc(new Date(item.creado).toLocaleString("es-AR")) + "</span></summary><dl>" +
            fields.map(function (entry) { return "<div><dt>" + esc(entry[0]) + "</dt><dd>" + esc(entry[1]) + "</dd></div>"; }).join("") +
            "</dl>" + controls + "</details></li>";
        }).join("") + "</ul>";
      }
      function showActivity(pages) {
        var panel = root.querySelector("[data-activity]");
        if (!pages.length) {
          panel.insertAdjacentHTML("beforeend", "<p>Cuando tengas una página, vas a poder ver su actividad acá.</p>");
          return;
        }
        panel.insertAdjacentHTML("beforeend",
          '<div class="pt-activity-filters"><label for="pt-activity-site">Sitio</label>' +
          '<select class="lb-input" id="pt-activity-site">' + pages.map(function (page) {
            return '<option value="' + Number(page.id) + '">' + esc(page.nombre) + "</option>";
          }).join("") + '</select><label for="pt-activity-period">Período</label>' +
          '<select class="lb-input" id="pt-activity-period"><option value="7">Últimos 7 días</option>' +
          '<option value="30" selected>Últimos 30 días</option></select></div>' +
          '<p class="pt-activity-status" role="status"></p><div data-activity-results></div>');
        var page = panel.querySelector("#pt-activity-site");
        var period = panel.querySelector("#pt-activity-period");
        var status = panel.querySelector("[role=status]");
        var results = panel.querySelector("[data-activity-results]");
        var request = 0;
        function loadActivity(saved) {
          var current = ++request;
          results.replaceChildren();
          status.textContent = "Cargando actividad…";
          api("GET", "/api/portal/actividad/" + page.value + "?dias=" + period.value).then(function (data) {
            if (current !== request) return;
            status.textContent = "Actividad de " + page.selectedOptions[0].textContent;
            var metrics = [
              ["Consultas recibidas", Number(data.consultas), "Formularios de contacto", "envelope"],
              ["Solicitudes de turno", Number(data.turnos), "Pedidos desde la landing", "calendar2-check"],
              ["Visitas", "—", "Medición pendiente", "bar-chart"],
              ["Clics en WhatsApp", "—", "Medición pendiente", "whatsapp"]
            ];
            results.innerHTML = '<dl class="pt-metrics">' + metrics.map(function (metric) {
              return '<div class="pt-metric' + (typeof metric[1] === "number" ? "" : " pt-metric-pending") +
                '"><dt><i class="bi bi-' + metric[3] + '" aria-hidden="true"></i>' + metric[0] + "</dt><dd><strong>" + metric[1] + "</strong><small>" + metric[2] + "</small></dd></div>";
            }).join("") + '</dl><h3 tabindex="-1" data-inbox-title>Consultas por atender <span class="pt-lead-count">' +
            Number(data.nuevas) + ' nuevas</span></h3>' +
            activityEntries(data.entradas.filter(function (item) { return item.tipo !== "turno"; }), "No hay consultas en este período.") +
            "<h3>Solicitudes de turno recientes</h3>" +
            activityEntries(data.entradas.filter(function (item) { return item.tipo === "turno"; }), "No hay solicitudes de turno en este período.");
            if (saved) {
              status.textContent += " · Estado guardado.";
              var form = results.querySelector('[data-lead="' + saved + '"]');
              if (form) {
                form.closest("details").open = true;
                form.querySelector("select").focus();
              } else results.querySelector("[data-inbox-title]").focus();
            }
          }).catch(function (err) {
            if (current === request) status.textContent = err.message;
          });
        }
        results.addEventListener("submit", function (event) {
          var form = event.target.closest("[data-lead]");
          if (!form) return;
          event.preventDefault();
          var current = request;
          var button = form.querySelector("button");
          button.disabled = true;
          api("PUT", "/api/portal/consultas/" + form.dataset.lead, {
            landing: Number(page.value), estado: form.elements.estado.value
          }).then(function () {
            if (current === request) loadActivity(form.dataset.lead);
          }).catch(function (err) {
            if (current !== request) return;
            button.disabled = false;
            status.textContent = err.message;
          });
        });
        page.addEventListener("change", function () { loadActivity(); });
        period.addEventListener("change", function () { loadActivity(); });
        loadActivity();
      }
      function home() {
        api("GET", "/api/portal/inicio").then(function (c) {
          if (sitio && c.slug && c.slug !== sitio) { loginForm("Esta sesión es de otro sitio."); return; }
          if (!sitio && c.sitio) { location.href = c.sitio; return; }
          root.classList.remove("pt-signed-out");
          setBrand(c.nombre);
          document.querySelector("[data-wa]").href = wa("Hola, soy " + c.nombre + ". Quiero consultar por mi sitio.");
          var plan = c.plan ? esc(c.plan) : "Sin plan";
          var alta = c.creado ? new Date(c.creado).toLocaleDateString("es-AR") : "—";
          var vence = c.plan_vence ? esc(c.plan_vence.split("-").reverse().join("/")) : "Sin fecha";
          var items = c.landings.map(function (lp) {
            var cuando = lp.actualizado ? new Date(lp.actualizado).toLocaleDateString("es-AR") : "";
            return '<li class="pt-card"><div class="pt-page-title"><i class="bi bi-window" aria-hidden="true"></i><div><h3>' + esc(lp.nombre) + "</h3>" +
              (lp.revision_estado ? '<p class="pt-plan">' + esc({
                pendiente: "Cambios pendientes de aprobación", aprobada: "Cambios aprobados y publicados",
                rechazada: "La última propuesta fue rechazada"
              }[lp.revision_estado]) + '</p>' : "") +
              (cuando ? '<p class="pt-plan">Último cambio: ' + esc(cuando) + "</p>" : "") + "</div></div>" +
              '<span class="pt-actions"><a class="btn-nx btn-sm" href="/maquetas/constructor.html?landing=' + lp.id + '&desde=sitio">Editar</a> ' +
              '<a class="btn-nx-outline btn-sm" href="/vista/' + lp.id + '" target="_blank" rel="noopener">Ver</a></span></li>';
          }).join("");
          function fact(label, value) {
            return value ? "<div><dt>" + label + "</dt><dd>" + esc(value) + "</dd></div>" : "";
          }
          root.innerHTML =
            '<div class="pt-top"><div><p class="lb-kicker">' + esc(c.rubro || "Tu sitio") + '</p><h1 class="pf-title">' + esc(c.nombre) + "</h1>" +
            '<p class="pt-plan">Revisá la actividad de tus sitios y editá tus páginas.</p></div></div>' +
            '<section class="pt-panel pt-activity" data-activity aria-labelledby="pt-activity-title"><h2 id="pt-activity-title">Actividad del sitio</h2></section>' +
            '<div class="pt-grid"><section class="pt-panel"><h2>Tus páginas</h2>' +
            (items ? '<ul class="pt-list">' + items + "</ul>" : "<p>Todavía no hay páginas. Pedile a Lanzate que publique la primera.</p>") +
            "</section><aside><section class=\"pt-panel\"><h2>Plan y soporte</h2><dl class=\"pt-facts\">" +
            "<div><dt>Plan</dt><dd>" + plan + "</dd></div>" +
            "<div><dt>Vencimiento del plan</dt><dd>" + vence + "</dd></div>" +
            "<div><dt>Alta</dt><dd>" + esc(alta) + "</dd></div>" +
            "<div><dt>Estado de la cuenta</dt><dd>" + esc(c.estado === "pausado" ? "Pausado" : "Activo") + "</dd></div>" +
            fact("Contacto", c.contacto) + fact("Email", c.email) + fact("Teléfono", c.telefono) +
            "</dl><div class=\"pt-help\">" +
            '<a href="' + wa("Hola, soy " + c.nombre + ". Quiero consultar qué incluye mi plan o cambiarlo.") + '" target="_blank" rel="noopener">Solicitar cambio de plan <i class="bi bi-arrow-up-right"></i></a>' +
            '<a href="' + wa("Hola, soy " + c.nombre + ". Quiero dar de baja mi sitio.") + '" target="_blank" rel="noopener">Consultar por la baja <i class="bi bi-arrow-up-right"></i></a>' +
            '<a href="' + wa("Hola, soy " + c.nombre + ". Necesito ayuda con mi sitio. El problema es:") + '" target="_blank" rel="noopener">Reportar un problema <i class="bi bi-whatsapp"></i></a>' +
            "</div></section></aside></div>" +
            '<section class="pt-access"><h2>Acceso</h2>' +
            "<p>Usuario: " + esc(c.usuario || "—") + "</p>" +
            '<p><button class="btn-nx-outline btn-sm" type="button" data-salir>Salir</button></p></section>';
          showActivity(c.landings);
          root.querySelector("[data-salir]").addEventListener("click", function () {
            api("POST", "/api/portal/logout", {}).then(function () { loginForm("Sesión cerrada."); });
          });
        }).catch(function () { loginForm(); });
      }
      var resetToken = new URLSearchParams(location.hash.slice(1)).get("restablecer");
      if (resetToken) {
        history.replaceState(null, "", location.pathname + location.search);
        root.classList.add("pt-signed-out");
        root.innerHTML = '<h1>Restablecé tu contraseña</h1><form class="pt-login">' +
          '<label>Contraseña nueva <input name="clave" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label>' +
          '<button class="btn-nx" type="submit">Guardar contraseña</button></form><p role="status"></p>';
        root.querySelector("form").addEventListener("submit", function (event) {
          event.preventDefault();
          var button = event.target.querySelector("button");
          var status = root.querySelector("[role=status]");
          button.disabled = true;
          api("POST", "/api/portal/restablecer", { token: resetToken, clave: event.target.elements.clave.value })
            .then(function () { loginForm("Contraseña actualizada. Ingresá con tu nueva contraseña."); })
            .catch(function (error) { status.textContent = error.message; button.disabled = false; });
        });
        return;
      }
      var ready = sitio ? api("GET", "/api/portal/sitio/" + sitio).then(function (site) { setBrand(site.nombre); }).catch(function () { root.innerHTML = "<p>Este sitio no existe.</p>"; return Promise.reject(); }) : Promise.resolve();
      ready.then(function () {
        return api("GET", "/api/portal/sesion");
      }).then(function (s) {
        if (s.ok) home(); else loginForm();
      }).catch(function (err) { if (err) loginForm(); });
    }());
  </script>
</body>
</html>
