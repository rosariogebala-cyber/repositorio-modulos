<body class="lib-page pf-page" data-page="consultas">

    <nav aria-label="Navegación principal">
      <a href="../index.html">Biblioteca<span class="lib-nav-long"> de módulos</span></a>

      <a href="constructor.html">Crear landing</a>

  <main class="pf-main">
    <div class="pf-head">
      <div>
        <p class="lb-kicker">Plataforma · <span data-pf-count>0 consultas</span></p>

        <p class="pf-sub">Lo que llega desde los formularios y las reservas de turnos de las landings&nbsp;publicadas.</p>
      </div>
    </div>

    <div class="pf-filters">
      <div class="lb-search">
        <i class="bi bi-search" aria-hidden="true"></i>

      <select class="lb-input pf-select" aria-label="Filtrar por cliente" data-pf-client-filter>

      </select>
      <select class="lb-input pf-select" aria-label="Filtrar por landing" data-pf-landing-filter>
        <option value="">Todas las landings</option>
      </select>
    </div>

    <p class="lb-msg" data-pf-msg role="status" aria-live="polite"></p>
    <section class="pf-panel">
      <ul class="pf-leads" data-pf-leads></ul>
      <p class="pf-empty" data-pf-leads-empty hidden></p>
    </section>
  </main>

  <script src="js/plataforma.js"></script>
