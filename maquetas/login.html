<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · Lanzate</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../assets/favicon-lanzate.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
  <link href="css/lanzate.css" rel="stylesheet">
</head>
<body class="lib-page">
  <a class="lib-skip-link" href="#contenido-principal">Saltar al contenido</a>
  <main class="lz-login" id="contenido-principal" tabindex="-1">
    <form class="lz-login-card" data-lz-login>
      <a class="lib-brand" href="../index.html"><span class="lib-brand-mark" aria-hidden="true"><i class="bi bi-rocket-takeoff-fill"></i></span>Lanzate</a>
      <h1>Ingresá a la&nbsp;plataforma</h1>
      <p>Ingresá tu usuario y contraseña para crear y editar landings.</p>
      <label class="lb-label" for="lzUsuario">Usuario</label>
      <input class="lb-input" id="lzUsuario" name="usuario" type="text" autocomplete="username" autocapitalize="none" required autofocus>
      <label class="lb-label" for="lzClave">Contraseña</label>
      <input class="lb-input" id="lzClave" name="clave" type="password" autocomplete="current-password" required>
      <p class="lb-msg" data-lz-msg role="status" aria-live="polite"></p>
      <button class="btn-nx" type="submit"><i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> Ingresar</button>
    </form>
  </main>
  <script>
    (function () {
      var form = document.querySelector("[data-lz-login]");
      var msg = document.querySelector("[data-lz-msg]");
      var volver = new URLSearchParams(location.search).get("volver") || "constructor.html";
      if (!/^(?:\/maquetas\/)?(?:constructor|landings|clientes|cliente|consultas|reglas)\.html(?:\?|$)/.test(volver)) volver = "constructor.html";
      fetch("/api/sesion", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (s) {
        if (s.ok) location.replace(volver);
      }).catch(function () {});
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var btn = form.querySelector("button");
        btn.disabled = true;
        msg.textContent = "";
        fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ usuario: form.elements.usuario.value, clave: form.elements.clave.value })
        }).then(function (r) {
          return r.json().catch(function () { return {}; }).then(function (data) {
            if (!r.ok) throw new Error(data.error || "No se pudo ingresar.");
            location.replace(volver);
          });
        }).catch(function (err) {
          msg.textContent = err.message;
          msg.className = "lb-msg is-warn";
          btn.disabled = false;
        });
      });
    })();
  </script>
</body>
</html>
