name: Browser RC checks
on:
  pull_request:
    branches: [feature/ficha-cliente-360-20261124, feature/planes-medicion-por-landing, qa/lanzate-v1-rc1, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-rc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.56.1 axe-core@4.11.0
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: python scripts/test-migrate-portal.py
      - run: python scripts/check-inline-js.py
      - run: python scripts/test-browser-rc.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-rc-report
          path: browser-rc-report.json
          if-no-files-found: error
