name: Calidad de landings y API

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  landing-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m py_compile server.py api/index.py scripts/migrar-datos.py scripts/servicios_simulados.py scripts/test-api.py
      - run: for file in js/*.js maquetas/js/*.js; do node --check "$file" || exit 1; done
      - run: python scripts/check-landing-quality.py
      - name: Pruebas de la API (login, límites, guardados, portal, pedidos, publicar)
        run: python scripts/test-api.py
